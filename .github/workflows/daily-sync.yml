name: Daily Telegram Sync

on:
  schedule:
    # Run daily at 3:00 AM UTC (5:00 AM Israel time)
    - cron: '0 3 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install telethon huggingface_hub sentence-transformers torch --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Download Telegram session from HF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          from huggingface_hub import hf_hub_download
          import shutil
          path = hf_hub_download(
              repo_id='rottg/telegram-db',
              filename='telegram_session.session',
              repo_type='dataset',
              token='$HF_TOKEN'
          )
          shutil.copy(path, 'telegram_session.session')
          print('Session downloaded from HF')
          "

      - name: Create sync config
        run: |
          cat > sync_config.json << 'EOF'
          {
            "api_id": ${{ secrets.TELEGRAM_API_ID }},
            "api_hash": "${{ secrets.TELEGRAM_API_HASH }}",
            "group": "${{ secrets.TELEGRAM_GROUP }}",
            "hours": 36
          }
          EOF

      - name: Download DBs from HF Dataset
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          from huggingface_hub import hf_hub_download
          import shutil
          import os

          # Download main DB
          print('Downloading telegram.db...')
          path = hf_hub_download(
              repo_id='rottg/telegram-db',
              filename='telegram.db',
              repo_type='dataset',
              token='$HF_TOKEN'
          )
          shutil.copy(path, 'telegram.db')
          size = os.path.getsize('telegram.db') / (1024*1024)
          print(f'Downloaded telegram.db ({size:.0f} MB)')

          # Download embeddings DB
          print('Downloading embeddings.db...')
          try:
              path = hf_hub_download(
                  repo_id='rottg/telegram-db',
                  filename='embeddings.db',
                  repo_type='dataset',
                  token='$HF_TOKEN'
              )
              shutil.copy(path, 'embeddings.db')
              size = os.path.getsize('embeddings.db') / (1024*1024)
              print(f'Downloaded embeddings.db ({size:.0f} MB)')
          except Exception as e:
              print(f'ERROR downloading embeddings.db: {e}')
              print('Will skip embeddings generation')
          "

      - name: Run daily sync
        run: |
          python daily_sync.py --hours 36

      - name: Upload DBs to HF Dataset
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          from huggingface_hub import HfApi
          import os
          api = HfApi(token='$HF_TOKEN')

          # Upload main DB
          api.upload_file(
              path_or_fileobj='telegram.db',
              path_in_repo='telegram.db',
              repo_id='rottg/telegram-db',
              repo_type='dataset',
              commit_message='Daily sync'
          )
          print('Uploaded telegram.db')

          # Upload embeddings DB if exists
          if os.path.exists('embeddings.db'):
              api.upload_file(
                  path_or_fileobj='embeddings.db',
                  path_in_repo='embeddings.db',
                  repo_id='rottg/telegram-db',
                  repo_type='dataset',
                  commit_message='Daily sync - embeddings'
              )
              print('Uploaded embeddings.db')
          "

      - name: Restart HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          from huggingface_hub import HfApi
          api = HfApi(token='$HF_TOKEN')
          api.restart_space(repo_id='rottg/telegram-analytics')
          print('Space restart triggered')
          "

      - name: Summary
        run: |
          echo "### Sync Complete! :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- DB uploaded to HF Dataset" >> $GITHUB_STEP_SUMMARY
          echo "- Space restart triggered" >> $GITHUB_STEP_SUMMARY
          echo "- Site: https://rottg-telegram-analytics.hf.space" >> $GITHUB_STEP_SUMMARY
